services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533" # Navidrome default HTTP port
    volumes:
      - ./data:/data # Persistent data storage
      - ./music:/music # Your music library
    environment:
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_SCANSCHEDULE=1h
      # Add more Navidrome environment variables as needed
    restart: always

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - "8080:80" # Filebrowser web interface port (changed to 8080 per instructions)
    volumes:
      - ./music:/srv # Mount music folder as filebrowser root
      - ./data/filebrowser.db:/database.db # Persistent database
    environment:
      - FB_NOAUTH=true # Disable authentication for simplicity; enable in production
    restart: always
